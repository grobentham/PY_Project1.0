name: XAU R7-R1 offline safety

on:
  push:
    branches:
      - xau-r7-r1-full-repair
    paths:
      - 'xau_r7_r1/**'
      - '.github/workflows/xau-r7-r1-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-runtime-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assemble builder-equivalent runtime tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci_r7
          mkdir -p ci_r7/r7_runtime ci_r7/r7_runtime_tests
          cp -R xau_r7_r1/runtime/. ci_r7/r7_runtime/
          cp -R xau_r7_r1/tests/. ci_r7/r7_runtime_tests/
          cp xau_r7_r1/START_XAU_R7_R1.bat.template ci_r7/START_XAU.bat
      - name: Compile R7-R1 runtime
        working-directory: ci_r7
        run: python -m compileall -q r7_runtime r7_runtime_tests
      - name: Run offline safety regression
        working-directory: ci_r7
        run: python -m unittest discover -s r7_runtime_tests -v

  windows-runtime-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse Windows builders and launcher template
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @(
            'xau_r7_r1/BUILD_R7_R1.ps1',
            'xau_r7_r1/PROBE_CANONICAL_R6_SOURCE.ps1',
            'xau_r7_r1/EXTRACT_CANONICAL_R6_PRODUCER_SOURCE.ps1',
            'xau_r7_r1/SEAL_R6_PRODUCER_CANDIDATE.ps1',
            'xau_r7_r1/PRECHECK_R6_FUSED_RELEASE.ps1'
          )) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw ($script + ' contains PowerShell parse errors')
            }
          }
          if (-not (Test-Path 'xau_r7_r1/START_XAU_R7_R1.bat.template' -PathType Leaf)) {
            throw 'START_XAU_R7_R1.bat.template missing'
          }
      - name: Validate builder source authority contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $builder = Get-Content 'xau_r7_r1/BUILD_R7_R1.ps1' -Raw
          $requiredBuilderTokens = @(
            "R7_R1_CANONICAL_SOURCE_BUILD_PREFLIGHT_V2",
            "R7_R1_R6_SOURCE_BUNDLE_V4",
            "R7_R1_R6_SOURCE_PROBE_V2",
            "canonical_source_preflight_version",
            "canonical_source_bundle_version",
            "canonical_source_probe_version",
            "prohibited_source_paths_blocked",
            "owned_output_replacement_verified",
            "ownership_marker_sha256"
          )
          foreach ($token in $requiredBuilderTokens) {
            if (-not $builder.Contains($token)) { throw ('builder missing source authority token: ' + $token) }
          }
          if ($builder.Contains('R7_R1_CANONICAL_SOURCE_BUILD_PREFLIGHT_V1')) { throw 'builder still references source preflight V1' }
          if ($builder.Contains('R7_R1_R6_SOURCE_BUNDLE_V3')) { throw 'builder still references source bundle V3' }
      - name: Validate wrapper certification authority contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $extract = Get-Content 'xau_r7_r1/EXTRACT_CANONICAL_R6_PRODUCER_SOURCE.ps1' -Raw
          $seal = Get-Content 'xau_r7_r1/SEAL_R6_PRODUCER_CANDIDATE.ps1' -Raw
          $precheck = Get-Content 'xau_r7_r1/PRECHECK_R6_FUSED_RELEASE.ps1' -Raw
          $requiredExtractTokens = @(
            "R7_R1_R6_SOURCE_BUNDLE_V4",
            "R7_R1_R6_SOURCE_PROBE_V2",
            "prohibited_source_paths_allowed",
            "owned_output_replacement_only",
            "ownership_marker_sha256",
            ".R7_R1_SOURCE_BUNDLE_OWNERSHIP.json"
          )
          foreach ($token in $requiredExtractTokens) {
            if (-not $extract.Contains($token)) { throw ('extract wrapper missing authority token: ' + $token) }
          }
          $requiredSealTokens = @(
            "R7_R1_R6_PRODUCER_CANDIDATE_SEAL_V4",
            "R7_R1_R6_PRODUCER_REPLAY_V4",
            "R7_R1_R6_PRODUCER_SOURCE_POLICY_V4",
            "trusted_replay_security_contract_pass",
            "process_isolation_enforced",
            "worker_module_sha256",
            "wall_timeout_seconds"
          )
          foreach ($token in $requiredSealTokens) {
            if (-not $seal.Contains($token)) { throw ('seal wrapper missing authority token: ' + $token) }
          }
          $requiredPrecheckTokens = @(
            "R7_R1_R6_FUSED_RELEASE_PRECHECK_V4",
            "R7_R1_R6_PRODUCER_REPLAY_V4",
            "R7_R1_R6_PRODUCER_SOURCE_POLICY_V4",
            "trusted_replay_security_contract_pass",
            "process_isolation_enforced",
            "worker_module_sha256",
            "wall_timeout_seconds"
          )
          foreach ($token in $requiredPrecheckTokens) {
            if (-not $precheck.Contains($token)) { throw ('precheck wrapper missing authority token: ' + $token) }
          }
          if ($extract.Contains('R7_R1_R6_SOURCE_BUNDLE_V3')) { throw 'extract wrapper still references V3 source bundle authority' }
          if ($seal.Contains('R7_R1_R6_PRODUCER_CANDIDATE_SEAL_V3')) { throw 'seal wrapper still references V3 authority' }
          if ($precheck.Contains('R7_R1_R6_FUSED_RELEASE_PRECHECK_V3')) { throw 'precheck wrapper still references V3 authority' }
      - name: Assemble builder-equivalent runtime tree
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force ci_r7 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force ci_r7/r7_runtime | Out-Null
          New-Item -ItemType Directory -Force ci_r7/r7_runtime_tests | Out-Null
          Copy-Item xau_r7_r1/runtime/* ci_r7/r7_runtime/ -Recurse -Force
          Copy-Item xau_r7_r1/tests/* ci_r7/r7_runtime_tests/ -Recurse -Force
          Copy-Item xau_r7_r1/START_XAU_R7_R1.bat.template ci_r7/START_XAU.bat -Force
      - name: Compile R7-R1 runtime on Windows
        working-directory: ci_r7
        run: python -m compileall -q r7_runtime r7_runtime_tests
      - name: Run Windows offline safety regression
        working-directory: ci_r7
        run: python -m unittest discover -s r7_runtime_tests -v
